# YoloNAS-S person detector trained from scratch on ~/data/person_detection_data (see dataset_params/person_detection_yolo_nas_dataset_params.yaml).
# Same as coco2017_yolo_nas_s.yaml except for the data and the number of classes.
#
#   uv run python src/super_gradients/train_from_recipe.py --config-name=person_yolo_nas_s
#   uv run python scripts/eval_person_detection.py --checkpoint checkpoints/person_yolo_nas_s/<RUN>/ckpt_best.pth

defaults:
  - training_hyperparams: coco2017_yolo_nas_train_params
  - dataset_params: person_detection_yolo_nas_dataset_params
  - arch_params: yolo_nas_s_arch_params
  - checkpoint_params: default_checkpoint_params
  - _self_
  - variable_setup

train_dataloader: coco_detection_yolo_format_train
val_dataloader: coco_detection_yolo_format_val

load_checkpoint: False
resume: False

arch_params:
  num_classes: 1

training_hyperparams:
  resume: ${resume}
  mixed_precision: True
  sync_bn: False # single GPU

architecture: yolo_nas_s

multi_gpu: Off
num_gpus: 1

experiment_suffix: ""
experiment_name: person_${architecture}${experiment_suffix}
